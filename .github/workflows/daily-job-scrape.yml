name: Daily Job Scrape

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  timed-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DB1_SUPABASE_URL: ${{ secrets.DB1_SUPABASE_URL }}
      DB1_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DB1_SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPE_WINDOW_MINUTES: '65'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run timed job scraper window
        run: node src/runTimedPipeline.js
